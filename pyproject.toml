[project]
name = "pose-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "rtmlib>=0.0.16",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "notebook>=7.6.5",
]
